<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Conta · Brenkz</title>
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0712;--card:#150f20;--line:#2d2240;--ink:#f4f1fa;--mut:#a69fb8;--ac:#8b5cf6;--acd:#3b2470;--dc:#5865f2;--ok:#7be0a4;--err:#ff8a9a;--font:"Outfit",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(800px 480px at 50% -60px,#3b1d70,transparent 70%),var(--bg);color:var(--ink);font:16px/1.5 var(--font);display:flex;flex-direction:column;align-items:center;padding:28px 16px}
a{color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.logo{font-size:24px;font-weight:600;text-decoration:none;margin-bottom:28px}
.logo b{color:var(--ac)}
.box{width:min(420px,100%);background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px}
.steps{display:flex;gap:8px;margin-bottom:22px;font-size:13px;color:var(--mut)}
.steps span{flex:1;padding:8px 10px;border-radius:10px;border:1px solid var(--line);text-align:center}
.steps span.on{border-color:var(--ac);color:var(--ink);background:var(--acd)}
.steps span.ok{border-color:#2c7a4b;color:var(--ok)}
h1{font-size:24px;font-weight:600;margin:0 0 6px}
p.sub{color:var(--mut);margin:0 0 20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:18px}
.tabs button{padding:10px;border-radius:12px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--mut);font:inherit}
.tabs button.on{background:var(--acd);border-color:var(--ac);color:var(--ink)}
label{display:block;font-weight:500;margin-bottom:14px}
label span{display:block;margin-bottom:6px;font-size:14px}
input{width:100%;background:#0d0c11;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:inherit;font:inherit}
input:focus{border-color:var(--ac)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 18px;border-radius:14px;border:1px solid var(--ac);background:var(--acd);color:var(--ink);font:inherit;font-weight:500;cursor:pointer;text-decoration:none}
.btn:hover{background:#4a2c8a}
.btn:disabled{opacity:.6;cursor:wait}
.btn.dc{background:var(--dc);border-color:var(--dc)}
.btn.dc:hover{background:#4752c4}
.btn.ghost{background:none;border-color:var(--line);margin-top:10px}
.msg{min-height:22px;margin:12px 0 0;font-size:14px;color:var(--err)}
.msg.ok{color:var(--ok)}
.me{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.me img,.me i{width:48px;height:48px;border-radius:50%;background:#33303c;display:grid;place-items:center;font-style:normal;font-weight:600;flex:none}
.me small{display:block;color:var(--mut)}
[hidden]{display:none!important}
</style>
</head>
<body>
<a class="logo" href="index.html">meu<b>perfil</b></a>

<div class="box">
  <div class="steps" aria-hidden="true"><span id="s1" class="on">1 · Criar conta</span><span id="s2">2 · Conectar Discord</span></div>

  <!-- etapa 1 -->
  <section id="v1">
    <h1 id="t1">Entre na sua conta</h1>
    <p class="sub" id="d1">Use o seu usuário e a sua senha.</p>
    <div class="tabs" role="tablist">
      <button type="button" id="tabIn" class="on" role="tab">Entrar</button>
      <button type="button" id="tabUp" role="tab">Criar conta</button>
    </div>
    <form id="form" autocomplete="on">
      <label><span>Nome de usuário</span><input id="user" autocomplete="username" maxlength="24" required placeholder="ex.: maria"></label>
      <label><span>Senha</span><input id="pass" type="password" autocomplete="current-password" minlength="8" maxlength="100" required></label>
      <label id="lc" hidden><span>Repita a senha</span><input id="pass2" type="password" autocomplete="new-password" maxlength="100"></label>
      <button class="btn" id="go" type="submit">Entrar</button>
    </form>
  </section>

  <!-- etapa 2 -->
  <section id="v2" hidden>
    <h1>Conecte o seu Discord</h1>
    <p class="sub">Falta só vincular o Discord para liberar o painel e a publicação da sua página.</p>
    <button class="btn dc" id="dc" type="button">Conectar com o Discord</button>
    <button class="btn ghost" id="out2" type="button">Sair da conta</button>
  </section>

  <!-- pronto -->
  <section id="v3" hidden>
    <h1>Tudo pronto</h1>
    <p class="sub">Sua conta está criada e o Discord conectado.</p>
    <div class="me"><img id="av" alt="" hidden><i id="avl"></i><div><b id="dn"></b><small id="un"></small></div></div>
    <a class="btn" href="painel.html">Ir para o painel</a>
    <button class="btn ghost" id="out3" type="button">Sair da conta</button>
  </section>

  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

<script>
(function(){
var API="https://painel-brenkz.bre-uccelli.workers.dev";
var TK="conta-token";
var $=function(i){return document.getElementById(i)};
var mode="in";
function msg(t,ok){var m=$("msg");m.textContent=t||"";m.className="msg"+(ok?" ok":"")}
function show(n){["v1","v2","v3"].forEach(function(v){$(v).hidden=v!=="v"+n});
  $("s1").className=n===1?"on":"ok";$("s2").className=n===2?"on":(n===3?"ok":"")}
function setMode(m){mode=m;var up=m==="up";
  $("tabIn").className=up?"":"on";$("tabUp").className=up?"on":"";
  $("lc").hidden=!up;$("pass2").required=up;
  $("go").textContent=up?"Criar conta":"Entrar";
  $("t1").textContent=up?"Crie a sua conta":"Entre na sua conta";
  $("d1").textContent=up?"Escolha um nome de usuário e uma senha de pelo menos 8 caracteres.":"Use o seu usuário e a sua senha.";
  $("pass").autocomplete=up?"new-password":"current-password";msg("")}
$("tabIn").onclick=function(){setMode("in")};
$("tabUp").onclick=function(){setMode("up")};

function sair(){localStorage.removeItem(TK);msg("");show(1);setMode("in")}
$("out2").onclick=sair;$("out3").onclick=sair;

$("form").onsubmit=function(e){
  e.preventDefault();msg("");
  var u=$("user").value.trim().toLowerCase(),p=$("pass").value;
  if(mode==="up"&&p!==$("pass2").value)return msg("As senhas não são iguais.");
  var b=$("go");b.disabled=true;
  fetch(API+(mode==="up"?"/register":"/login"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({user:u,pass:p})})
    .then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
    .then(function(x){if(!x.ok)throw new Error(x.j.erro||"Não foi possível continuar.");localStorage.setItem(TK,x.j.token);return carregar(false)})
    .catch(function(err){msg(err.message==="Failed to fetch"?"Não consegui falar com o servidor. Tente de novo.":err.message)})
    .then(function(){b.disabled=false});
};

$("dc").onclick=function(){location.href=API+"/discord/start?t="+encodeURIComponent(localStorage.getItem(TK)||"")};

function carregar(veioDoDiscord){
  var t=localStorage.getItem(TK);if(!t){show(1);return Promise.resolve()}
  return fetch(API+"/me",{headers:{Authorization:"Bearer "+t}})
    .then(function(r){if(!r.ok)throw 0;return r.json()})
    .then(function(me){
      if(!me.discord){show(2);return}
      show(3);$("dn").textContent=me.discord.name;$("un").textContent="@"+me.user;
      $("avl").textContent=me.user[0].toUpperCase();
      if(me.discord.avatar){$("av").src=me.discord.avatar;$("av").hidden=false;$("avl").hidden=true}
      if(veioDoDiscord)setTimeout(function(){location.href="painel.html"},1400);
    })
    .catch(function(){localStorage.removeItem(TK);show(1)});
}

var q=new URLSearchParams(location.search);
var erros={"discord":"Não foi possível conectar o Discord. Tente de novo.","discord-em-uso":"Esse Discord já está ligado a outra conta."};
if(q.get("erro"))msg(erros[q.get("erro")]||"Algo deu errado.");
if(q.get("discord")==="ok")msg("Discord conectado! Abrindo o painel…",true);
if(q.has("erro")||q.has("discord"))history.replaceState(null,"","conta.html");
carregar(q.get("discord")==="ok");
})();
</script>
</body>
</html>
